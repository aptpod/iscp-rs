[package]
name = "iscp-rs"
version = "1.1.2"
authors = ["aptpod,Inc."]
edition = "2024"
description = "iSCPv2 Client Library"
documentation = "https://docs.rs/iscp-rs"
repository = "https://github.com/aptpod/iscp-rs/"
license = "Apache-2.0"

[lib]
name = "iscp"

[features]
default = []
gen = []
unstable-deflate-window-bits = []
unstable-webtransport = ["dep:wtransport"]

[build-dependencies]
anyhow = "1"
glob = "0.3.0"
prost-build = "0.13.2"
protobuf-src = "2.1.1"
regex = "1"

[dev-dependencies]
env_logger = "0.11.0"

[dependencies]
byteorder = "1.5.0"
bytes = { version = "1.6.0", features = ["serde"] }
crossbeam = "0.8.0"
flate2 = { version = "1.0.30", features = ["zlib-ng"] }
fnv = "1.0.7"
futures = "0.3.30"
log = "0.4.14"
prost = "0.13.2"
prost-types = "0.13.2"
quinn = { version = "0.11.5", default-features = false, features = ["log", "ring", "runtime-tokio", "rustls"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
reqwest-websocket = "0.6.0"
rustls = { version = "0.23.13", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
serde_qs = "1.1.1"
thiserror = "2.0.18"
tokio = { version = "1.37.0", features = ["full"] }
tokio-util = "0.7.11"
url = "2.5"
uuid = { version = "1.8.0", features = ["serde", "v4"] }
wtransport = { version = "0.7.1", features = ["dangerous-configuration"], optional = true }

[profile.test]
debug = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
